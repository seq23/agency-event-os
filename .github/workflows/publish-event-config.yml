name: Publish event configuration package
on:
  workflow_dispatch:
    inputs:
      event_config_package:
        description: Relative path under event-config-packages/
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EVENT_CONFIG_PACKAGE: ${{ github.event.inputs.event_config_package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Import validated package
        run: node scripts/import_event_config_package.js "$EVENT_CONFIG_PACKAGE"
      - name: Verify event surfaces changed
        run: |
          if git diff --quiet -- data/events data/access public/events; then
            echo "No event configuration changes were produced."
            exit 1
          fi
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Publish validated event configuration"
          title: "Publish validated event configuration"
          body: "Generated from the validated EVENT_CONFIG_PACKAGE workflow input."
          branch: automation/publish-event-config
          delete-branch: true
