name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Optional manual Cloudflare deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=4096
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POSTDEPLOY_BASE_URL: https://west-peek-live.seq-taylor.workers.dev
      SMOKE_BASE_URL: https://west-peek-live.seq-taylor.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: secrets
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node 22
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: Validate release prepush
        if: steps.secrets.outputs.ready == 'true'
        run: timeout --signal=TERM 20m npm run release:prepush:container

      - name: Build Cloudflare worker
        if: steps.secrets.outputs.ready == 'true'
        run: timeout --signal=TERM 15m npm run cf:build:recoverable

      - name: Verify worker artifact
        if: steps.secrets.outputs.ready == 'true'
        run: test -f .open-next/worker.js

      - name: Deploy Cloudflare worker
        if: steps.secrets.outputs.ready == 'true'
        run: timeout --signal=TERM 5m npm run cf:deploy -- --keep-vars

      - name: Postdeploy smoke
        if: steps.secrets.outputs.ready == 'true'
        run: timeout --signal=TERM 5m npm run postdeploy:smoke
