name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:everything -- --tier=1
      - run: NODE_OPTIONS="--max-old-space-size=3072" npm run cf:build
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Postdeploy smoke if URL configured
        if: ${{ vars.POSTDEPLOY_BASE_URL != '' }}
        run: POSTDEPLOY_BASE_URL="${{ vars.POSTDEPLOY_BASE_URL }}" npm run postdeploy:smoke
